# Windows clients bundled in the release zip, built from source by dist/package.ps1:
#   <name> <Go module@version> <module h1: hash> <git commit> <tag time, UTC>
#
# package.ps1 fetches each source module through the Go module proxy (the go command
# checks it against sum.golang.org), checks it against the h1: hash here and, when the
# proxy reports one, the commit, builds it with upstream's tags and version flags
# (CGO_ENABLED=0, -trimpath, GOOS=windows GOARCH=amd64), and puts docker.exe and
# cli-plugins\docker-compose.exe in clients\. Dependencies are checked against the
# source's own go.sum (vendor.sum for docker/cli). The commit and the tag time are
# stamped into `docker version` and checked against the proxy's record.
#
# Why not Docker's prebuilt files: download.docker.com publishes no checksum, signature
# or provenance for win/static/stable/x86_64/docker-<ver>.zip, and its docker.exe is not
# Authenticode-signed, so a pin would be trust on first use. A source build is checked
# end to end and is reproducible with the same Go version.
#
# Bump rules: docker-cli follows the guest's Docker Engine (guest/prototype/sources.lock,
# docker-engine 29.9.2). Take the h1: hash from `go mod download -json <module@version>`
# (its Sum) and the commit and time from https://proxy.golang.org/<module>/@v/<version>.info.
