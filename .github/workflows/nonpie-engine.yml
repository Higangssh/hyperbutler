name: Non-PIE engine

# Builds dockerd, docker-proxy, containerd and containerd-shim-runc-v2 without PIE from
# the aports commits and upstream sources of the docker-engine and containerd packages in
# sources.lock (ADR 0005, Follow-up 10), in the same digest-pinned Alpine container as the
# guest image, and checks the result against the lock's engine-nonpie pin.
#
# - After a docker-engine or containerd bump: run it by hand, upload the tar it reports to
#   the guest-inputs release (gh release upload guest-inputs <file>) and pin the lock line
#   it prints. The guest image takes the binaries from that pin.
# - On every change to the lock or the build script: the rebuild must give the pinned
#   bytes (the build is reproducible), so the pinned tar is checkable by anyone.

on:
  workflow_dispatch:
  # Weekly: whether the pin can still be rebuilt with what the Alpine repository serves.
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main, feat/nonpie-engine] # TODO: main only before merging
    paths:
      - guest/prototype/sources.lock
      - scripts/guest-image/build-nonpie.sh
      - scripts/guest-image/fetch-verify.sh
      - scripts/guest-image/test-engine-nonpie.sh
      - .github/workflows/nonpie-engine.yml
  pull_request:
    paths:
      - guest/prototype/sources.lock
      - scripts/guest-image/build-nonpie.sh
      - scripts/guest-image/fetch-verify.sh
      - scripts/guest-image/test-engine-nonpie.sh
      - .github/workflows/nonpie-engine.yml

permissions:
  contents: read

jobs:
  build:
    name: non-PIE engine (alpine container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same image as guest-image.yml; bump together.
      ALPINE_IMAGE: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build in the Alpine container
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nonpie"
          mkdir -p "$out"
          docker pull --quiet "$ALPINE_IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$out:/out" \
            -e HYPERBUTLER_IMAGE="$ALPINE_IMAGE" -e HYPERBUTLER_HOST_UID="$(id -u)" \
            "$ALPINE_IMAGE" /bin/sh /src/scripts/guest-image/build-nonpie.sh /src/guest/prototype/sources.lock /out

      - name: fetch-verify.sh refuses a wrong engine-nonpie
        run: |
          set -euo pipefail
          set -- "$RUNNER_TEMP"/nonpie/engine-nonpie-*.tar
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/nonpie:/out:ro" \
            "$ALPINE_IMAGE" /bin/sh /src/scripts/guest-image/test-engine-nonpie.sh /src/guest/prototype/sources.lock "/out/${1##*/}"

      # Before the comparison, so a run after a bump (which fails it) still has the tar.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nonpie-engine
          path: ${{ runner.temp }}/nonpie/
          if-no-files-found: error
          retention-days: 14

      - name: Compare with the pin
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/nonpie"
          set -- "$out"/engine-nonpie-*.tar
          tar=$1
          file=${tar##*/}
          got=$(sha256sum "$tar" | cut -d' ' -f1)
          line="engine-nonpie $got https://github.com/Higangssh/hyperbutler/releases/download/guest-inputs/$file"
          {
            echo '### Non-PIE engine'
            echo
            echo '```'
            cat "$out/BUILDINFO.txt"
            echo
            echo "$line"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # Same pattern as build-nonpie.sh and fetch-verify.sh.
          read -r _ pin url < <(grep -E '^[[:space:]]*engine-nonpie[[:space:]]' guest/prototype/sources.lock || echo "- - -")
          pinned=${url##*/}
          if [ "$pin" = - ]; then
            echo "::error title=non-PIE engine::the lock has no engine-nonpie line; upload $file to guest-inputs and pin: $line"
            exit 1
          fi
          # The name without its hash suffix: engine-nonpie-docker-<ver>-containerd-<ver>
          if [ "${pinned%-*}" != "${file%-*}" ]; then
            echo "::error title=non-PIE engine::the lock pins $pinned, but its packages now make ${file%-*}-*.tar: upload $file to guest-inputs and pin: $line"
            exit 1
          fi
          if [ "$pin" = "$got" ]; then
            echo "the rebuild matches the pinned $pinned"
            exit 0
          fi
          # A mismatch with the same toolchain means the build is not reproducible (or the
          # pinned tar is not this build). With a newer toolchain from the Alpine
          # repository it only means the pin can no longer be rebuilt today.
          curl --proto '=https' -fsSL --retry 3 -o "$RUNNER_TEMP/pinned.tar" "$url"
          echo "$pin  $RUNNER_TEMP/pinned.tar" | sha256sum -c --strict --quiet
          tar -xOf "$RUNNER_TEMP/pinned.tar" BUILDINFO.txt | sed -n '/^toolchain:/,$p' >"$RUNNER_TEMP/pinned-toolchain.txt"
          sed -n '/^toolchain:/,$p' "$out/BUILDINFO.txt" >"$RUNNER_TEMP/new-toolchain.txt"
          if ! cmp -s "$RUNNER_TEMP/pinned-toolchain.txt" "$RUNNER_TEMP/new-toolchain.txt"; then
            diff "$RUNNER_TEMP/pinned-toolchain.txt" "$RUNNER_TEMP/new-toolchain.txt" || true
            echo "::warning title=non-PIE engine::the Alpine toolchain moved since $pinned was built (diff above), so this rebuild differs; the pin stays valid. Re-pin with $line to make it checkable again."
            exit 0
          fi
          echo "::error title=non-PIE engine::the rebuild of $pinned with the same toolchain is $got, but the lock pins $pin: the build is not reproducible, or the pinned tar is not this build"
          exit 1
