name: Fuzz (weekly)

# The long fuzz run. ci.yml fuzzes every target for 10 s on each push and PR; this runs
# the same script with more time per target once a week, and on demand.

on:
  schedule:
    # Sundays 18:00 UTC.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per Fuzz target (go test -fuzztime)
        type: string
        default: 1m

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Use exactly the Go that setup-go installed; never download another toolchain.
  GOTOOLCHAIN: local

defaults:
  run:
    shell: pwsh

jobs:
  fuzz:
    name: fuzz (${{ inputs.fuzztime || '1m' }} per target)
    runs-on: windows-latest
    # 88 targets at 1 m is about 90 minutes with the builds.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.mod
            go.sum

      - name: Run every Fuzz target
        env:
          FUZZTIME: ${{ inputs.fuzztime || '1m' }}
          # Raise it whenever a Fuzz target is added (also in ci.yml).
          FUZZ_MIN_TARGETS: "96"
        run: ./scripts/ci/fuzz-all.ps1

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
          retention-days: 14
