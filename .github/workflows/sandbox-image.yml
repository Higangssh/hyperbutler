name: Sandbox image

# The canonical build of the agent sandbox image (ADR 0009, "The sandbox image"; ADR 0005,
# Decision 4): on a GitHub-hosted Linux runner, a Debian system from the snapshot and the
# digest-pinned container in guest/sandbox/debian.lock, booted by the kernel and stage 1 of
# the guest image built in the same run. Release images come only from here, never from a
# developer machine.
#
# Reusable: ci.yml calls it on every push and PR, release.yml calls it on a tag with the
# source bundle on. The caller passes the guest-image job's outputs, and the artifact is
# checked against that digest before anything reads it.

on:
  workflow_call:
    inputs:
      guest-artifact-name:
        description: Name of the guest-image artifact of this run
        type: string
        required: true
      guest-sums-sha256:
        description: SHA-256 of that artifact's SHA256SUMS file (the guest-image job's output)
        type: string
        required: true
      with-sources:
        description: Also build the source bundle of the Debian packages
        type: boolean
        default: false
      artifact-name:
        type: string
        default: sandbox-image
    outputs:
      artifact-name:
        description: Name of the uploaded artifact
        value: ${{ jobs.build.outputs.artifact-name }}
      sums-sha256:
        description: SHA-256 of the artifact's SHA256SUMS file, for the consumer to check
        value: ${{ jobs.build.outputs.sums-sha256 }}

permissions:
  contents: read

jobs:
  build:
    name: sandbox image (debian container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ inputs.artifact-name }}
      sums-sha256: ${{ steps.sums.outputs.sha256 }}
    env:
      # Use exactly the Go that setup-go installed; never download another toolchain.
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      HYPERBUTLER_WITH_SOURCES: ${{ inputs.with-sources && '1' || '0' }}
      HYPERBUTLER_RELEASE_URL: ${{ github.ref_type == 'tag' && format('{0}/{1}/releases/download/{2}', github.server_url, github.repository, github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a release build must not read state that a PR run could have written.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.guest-artifact-name }}
          path: ${{ runner.temp }}/guest

      - name: Verify the guest image artifact
        env:
          WANT: ${{ inputs.guest-sums-sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/guest"
          got=$(sha256sum SHA256SUMS | cut -d' ' -f1)
          if [ "$got" != "$WANT" ]; then
            echo "::error::guest SHA256SUMS digest $got, the build job reported $WANT"
            exit 1
          fi
          sha256sum --check --strict --quiet SHA256SUMS

      - name: Build
        run: sh scripts/guest-image/build-sandbox.sh "$RUNNER_TEMP/guest" "$RUNNER_TEMP/sandbox-image"

      - name: Check and summarize
        id: sums
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sandbox-image"
          sha256sum --check --strict --quiet SHA256SUMS
          echo "sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          {
            echo '### Sandbox image'
            echo
            echo '| File | Bytes | SHA-256 |'
            echo '|---|---:|---|'
            for f in vmlinuz-virt initramfs-stage1.gz system.vhd image.json sandbox-packages.tsv sandbox-sources.tar*; do
              [ -f "$f" ] || continue
              echo "| \`$f\` | $(stat -c %s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo '```'
            cat BUILDINFO.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/sandbox-image/
          if-no-files-found: error
          retention-days: 14
          # The disk is erofs with lz4hc and the tarballs are xz; zipping them again only
          # costs time.
          compression-level: 0
