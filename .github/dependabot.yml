version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait before proposing a fresh release, so a hijacked one has time to be pulled.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      golang-x:
        patterns:
          - golang.org/x/*

  # Bumps the SHA-pinned actions in .github/workflows and keeps the version comments in
  # sync. Not covered: golangci-lint (version + SHA-256 in ci.yml) and govulncheck
  # (version in ci.yml); bump those by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Wait before proposing a fresh release, so a hijacked one has time to be pulled.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
